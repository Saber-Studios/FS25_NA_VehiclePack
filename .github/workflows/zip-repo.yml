name: Zip FS25 mods

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip FS25 mod folders (correct structure)
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$RUNNER_TEMP/zips"
          mkdir -p "$OUT_DIR"

          cd "$GITHUB_WORKSPACE"

          # Loop over top-level directories only
          for dir in */ ; do
            base="${dir%/}"

            # Skip non-mod / internal folders
            case "$base" in
              .git|.github) continue ;;
            esac

            # Only zip real FS mods
            if [[ ! -f "$base/modDesc.xml" ]]; then
              echo "Skipping $base (no modDesc.xml)"
              continue
            fi

            ZIP_NAME="${base}.zip"
            echo "Zipping FS mod: $ZIP_NAME"

            # Zip the *contents* of the mod folder (no extra folder level)
            (
              cd "$base"
              zip -r "$OUT_DIR/$ZIP_NAME" . \
                -x "**/.DS_Store" \
                   "**/Thumbs.db"
            )
          done

          echo "Final ZIP files:"
          ls -lah "$OUT_DIR"

      - name: Upload mod ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: fs25-mod-zips
          path: ${{ runner.temp }}/zips/*.zip
          if-no-files-found: error
          retention-days: 7

