name: Zip top-level folders (clean names)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zips (one per top-level folder)
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$RUNNER_TEMP/zips"
          mkdir -p "$OUT_DIR"

          cd "$GITHUB_WORKSPACE"

          # Find immediate subdirectories (top-level folders)
          while IFS= read -r -d '' dir; do
            base="$(basename "$dir")"

            # Skip folders you don't want packaged
            case "$base" in
              .git|.github) continue ;;
            esac

            ZIP_NAME="${base}.zip"
            echo "Zipping folder: $base -> $ZIP_NAME"

            zip -r "$OUT_DIR/$ZIP_NAME" "$base" \
              -x "**/.DS_Store" \
                 "**/Thumbs.db"

          done < <(find . -mindepth 1 -maxdepth 1 -type d -print0)

          echo "Created zips:"
          ls -lah "$OUT_DIR"

      - name: Upload zips artifact
        uses: actions/upload-artifact@v4
        with:
          name: folder-zips
          path: ${{ runner.temp }}/zips/*.zip
          if-no-files-found: error
          retention-days: 7
