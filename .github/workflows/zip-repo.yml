name: Zip repository

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          ZIP_NAME="${REPO_NAME}-${SHA_SHORT}.zip"

          cd "$GITHUB_WORKSPACE"

          # Create zip in temp so it won't get included in itself
          zip -r "$RUNNER_TEMP/$ZIP_NAME" . \
            -x ".git/*" \
               ".github/*" \
               "**/.DS_Store"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$RUNNER_TEMP/$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lah "$RUNNER_TEMP"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-zip
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 7

